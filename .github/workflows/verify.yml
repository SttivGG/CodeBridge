name: Verificar CodeBridge
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas y generar content script
        run: npm run verify
      - name: Verificar bundle reproducible
        run: git diff --exit-code -- whatsapp.js
      - name: Validar scripts Python
        run: python -m compileall -q tests
